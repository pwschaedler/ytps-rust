[package]
name = "ytps-rust"
version = "0.1.0"
edition = "2024"
description = "A YouTube playlist search tool."

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
google-youtube3 = "7.0.0"
thiserror = "2.0.21"

# Borrowed from https://www.namtao.com/rust/
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
